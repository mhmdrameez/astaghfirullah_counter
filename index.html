<style>
  :root {
    --bg: #f4f7f5;
    --card-bg: #ffffff;
    --text: #1f2d27;
    --subtext: #6b7d75;
    --border: #dfe7e2;
    --accent: #2f7a5c;
    --accent-dark: #235c46;
    --track: #e6ede9;
    --shadow: rgba(0,0,0,0.08);
    --gold: #b8902f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1512;
      --card-bg: #16201b;
      --text: #eef4f0;
      --subtext: #9db1a7;
      --border: #263229;
      --track: #202b25;
      --shadow: rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1512;
    --card-bg: #16201b;
    --text: #eef4f0;
    --subtext: #9db1a7;
    --border: #263229;
    --track: #202b25;
    --shadow: rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 10px 30px var(--shadow);
    padding: 28px 24px 24px;
    text-align: center;
  }

  .arabic {
    font-size: 30px;
    font-weight: 600;
    color: var(--accent-dark);
    margin-bottom: 4px;
    direction: rtl;
  }

  .phrase-select {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .phrase-select button {
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .phrase-select button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .translit {
    font-size: 14px;
    color: var(--subtext);
    margin-bottom: 2px;
  }

  .meaning {
    font-size: 12px;
    color: var(--subtext);
    margin-bottom: 20px;
  }

  .count-display {
    font-size: 64px;
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin: 10px 0 4px;
    user-select: none;
  }

  .target-label {
    font-size: 13px;
    color: var(--subtext);
    margin-bottom: 18px;
    font-variant-numeric: tabular-nums;
  }

  .progress-track {
    width: 100%;
    height: 8px;
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 22px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    border-radius: 999px;
    transition: width 0.25s ease;
  }

  .tap-btn {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 30%, var(--accent), var(--accent-dark));
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(47,122,92,0.35);
    transition: transform 0.1s ease;
    margin: 0 auto 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .tap-btn:active { transform: scale(0.94); }

  .targets {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .targets button {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .targets button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .controls {
    display: flex;
    gap: 10px;
  }

  .controls button {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }

  .celebrate {
    margin-top: 14px;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent-dark);
    display: none;
  }
  .celebrate.show { display: block; }

  .sessions {
    margin-top: 16px;
    font-size: 12px;
    color: var(--subtext);
  }

  .pacing-row {
    margin-bottom: 18px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }

  .pacing-label {
    display: block;
    font-size: 12px;
    color: var(--subtext);
    margin-bottom: 8px;
  }

  .pacing-options {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 10px;
  }

  .pacing-options button {
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .pacing-options button.active {
    background: var(--gold);
    color: #fff;
    border-color: var(--gold);
  }

  .pacing-toggle {
    width: 100%;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }

  .pacing-toggle.running {
    background: var(--gold);
    color: #fff;
    border-color: var(--gold);
  }

  @keyframes pacingPulse {
    0% { box-shadow: 0 10px 24px rgba(47,122,92,0.35), 0 0 0 0 rgba(184,144,47,0.6); }
    70% { box-shadow: 0 10px 24px rgba(47,122,92,0.35), 0 0 0 18px rgba(184,144,47,0); }
    100% { box-shadow: 0 10px 24px rgba(47,122,92,0.35), 0 0 0 0 rgba(184,144,47,0); }
  }

  .tap-btn.pulse {
    animation: pacingPulse 0.9s ease-out;
  }
</style>
</head>
<body>

<div class="card">
  <div class="phrase-select" id="phraseSelect">
    <button data-phrase="simple" class="active">Astaghfirullah</button>
    <button data-phrase="azeem">Astaghfirullah al-'Azeem</button>
  </div>

  <div class="arabic" id="arabicText">أَسْتَغْفِرُ اللّٰهَ</div>
  <div class="translit" id="translitText">Astaghfirullah</div>
  <div class="meaning" id="meaningText">I seek forgiveness from Allah</div>

  <div class="count-display" id="countDisplay">0</div>
  <div class="target-label" id="targetLabel">Target: 100</div>

  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <button class="tap-btn" id="tapBtn">Tap<br>to Count</button>

  <div class="targets" id="targetButtons">
    <button data-target="1000" class="active">1000</button>
    <button data-target="5000">5000</button>
    <button data-target="10000">10000</button>
  </div>

  <div class="pacing-row">
    <span class="pacing-label">Auto-increment every</span>
    <div class="pacing-options" id="pacingOptions">
      <button data-sec="3">3s</button>
      <button data-sec="5" class="active">5s</button>
      <button data-sec="10">10s</button>
    </div>
    <button class="pacing-toggle" id="pacingToggleBtn">Start Auto</button>
  </div>

  <div class="controls">
    <button id="undoBtn">Undo</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div class="celebrate" id="celebrateText">🤍 Target reached — Allahu a'lam, may it be accepted.</div>
  <div class="sessions" id="sessionsText"></div>
  <button id="installBtn" style="display:none; width:100%; margin-top:14px; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--accent); color:#fff; font-weight:600; font-size:13px; cursor:pointer;">⬇️ Install App</button>
</div>

<script>
(function() {
  const STORAGE_KEY = 'astaghfirullah_counter_v1';

  let count = 0;
  let target = 1000;
  let totalAllTime = 0;
  let phrase = 'simple';

  const PHRASES = {
    simple: {
      arabic: 'أَسْتَغْفِرُ اللّٰهَ',
      translit: 'Astaghfirullah',
      meaning: 'I seek forgiveness from Allah'
    },
    azeem: {
      arabic: 'أَسْتَغْفِرُ اللّٰهَ الْعَظِيمَ',
      translit: "Astaghfirullah al-'Azeem",
      meaning: 'I seek forgiveness from Allah, the Mighty'
    }
  };

  const arabicText = document.getElementById('arabicText');
  const translitText = document.getElementById('translitText');
  const meaningText = document.getElementById('meaningText');
  const phraseSelect = document.getElementById('phraseSelect');

  const countDisplay = document.getElementById('countDisplay');
  const targetLabel = document.getElementById('targetLabel');
  const progressFill = document.getElementById('progressFill');
  const tapBtn = document.getElementById('tapBtn');
  const targetButtons = document.getElementById('targetButtons');
  const undoBtn = document.getElementById('undoBtn');
  const resetBtn = document.getElementById('resetBtn');
  const celebrateText = document.getElementById('celebrateText');
  const sessionsText = document.getElementById('sessionsText');
  const pacingOptions = document.getElementById('pacingOptions');
  const pacingToggleBtn = document.getElementById('pacingToggleBtn');

  let pacingSec = 5;
  let pacingRunning = false;
  let pacingTimerId = null;
  let audioCtx = null;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (typeof s.count === 'number') count = s.count;
        if (typeof s.target === 'number') target = s.target;
        if (typeof s.totalAllTime === 'number') totalAllTime = s.totalAllTime;
        if (typeof s.phrase === 'string' && PHRASES[s.phrase]) phrase = s.phrase;
      }
    } catch (e) {
      // start fresh if storage unavailable
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ count, target, totalAllTime, phrase }));
    } catch (e) {
      // ignore, continue in-memory
    }
  }

  function formatNumber(n) {
    return n.toLocaleString();
  }

  function render() {
    const p = PHRASES[phrase];
    arabicText.textContent = p.arabic;
    translitText.textContent = p.translit;
    meaningText.textContent = p.meaning;
    Array.from(phraseSelect.children).forEach(btn => {
      btn.classList.toggle('active', btn.dataset.phrase === phrase);
    });

    countDisplay.textContent = formatNumber(count);
    targetLabel.textContent = 'Target: ' + formatNumber(target);
    const pct = Math.min(100, Math.round((count / target) * 100));
    progressFill.style.width = pct + '%';

    Array.from(targetButtons.children).forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.dataset.target, 10) === target);
    });

    celebrateText.classList.toggle('show', count >= target && count > 0);
    sessionsText.textContent = totalAllTime > 0 ? ('All-time total: ' + formatNumber(totalAllTime)) : '';
  }

  tapBtn.addEventListener('click', function() {
    unlockAudioContext();
    count += 1;
    totalAllTime += 1;
    if (navigator.vibrate) {
      try { navigator.vibrate(15); } catch (e) {}
    }
    render();
    saveState();
  });

  undoBtn.addEventListener('click', function() {
    if (count > 0) {
      count -= 1;
      if (totalAllTime > 0) totalAllTime -= 1;
      render();
      saveState();
    }
  });

  resetBtn.addEventListener('click', function() {
    count = 0;
    render();
    saveState();
  });

  targetButtons.addEventListener('click', function(e) {
    const btn = e.target.closest('button[data-target]');
    if (!btn) return;
    target = parseInt(btn.dataset.target, 10);
    render();
    saveState();
  });

  phraseSelect.addEventListener('click', function(e) {
    const btn = e.target.closest('button[data-phrase]');
    if (!btn) return;
    phrase = btn.dataset.phrase;
    render();
    saveState();
  });

  pacingOptions.addEventListener('click', function(e) {
    const btn = e.target.closest('button[data-sec]');
    if (!btn) return;
    pacingSec = parseInt(btn.dataset.sec, 10);
    Array.from(pacingOptions.children).forEach(b => {
      b.classList.toggle('active', b === btn);
    });
    if (pacingRunning) {
      stopPacing();
      startPacing();
    }
  });

  function unlockAudioContext() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      // iOS Safari workaround: play a silent buffer directly inside a user
      // gesture to fully unlock the audio context for later programmatic use.
      const buffer = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(audioCtx.destination);
      if (src.start) { src.start(0); } else if (src.noteOn) { src.noteOn(0); }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    } catch (e) {
      // audio unavailable, fail silently
    }
  }

  function playTickSound() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      const fire = function() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1100, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.13);
      };
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(fire).catch(function() { fire(); });
      } else {
        fire();
      }
    } catch (e) {
      // audio unavailable, fail silently
    }
  }

  let nextTickAt = 0;
  let wakeLock = null;

  function applyOneTick() {
    tapBtn.classList.remove('pulse');
    void tapBtn.offsetWidth;
    tapBtn.classList.add('pulse');
    playTickSound();
    count += 1;
    totalAllTime += 1;
  }

  function scheduleNextTick() {
    nextTickAt = Date.now() + pacingSec * 1000;
  }

  // Runs frequently while Auto is on. Uses real elapsed time (Date.now()) rather
  // than relying on setInterval firing on schedule, so if the browser throttles
  // or pauses timers (screen locked, tab backgrounded), the count catches up
  // correctly the moment the page becomes active again instead of staying stuck.
  function checkTick() {
    if (!pacingRunning) return;
    const now = Date.now();
    if (now < nextTickAt) return;

    const missedTicks = Math.floor((now - nextTickAt) / (pacingSec * 1000)) + 1;
    let applied = 0;
    for (let i = 0; i < missedTicks; i++) {
      if (count >= target) break;
      count += 1;
      totalAllTime += 1;
      applied++;
    }
    nextTickAt += missedTicks * pacingSec * 1000;

    if (applied > 0) {
      tapBtn.classList.remove('pulse');
      void tapBtn.offsetWidth;
      tapBtn.classList.add('pulse');
      playTickSound();
      render();
      saveState();
    }
    if (count >= target) {
      stopPacing();
    }
  }

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', function() { wakeLock = null; });
      }
    } catch (e) {
      // Wake Lock unsupported or denied; app still works, screen may just sleep on its own.
    }
  }

  function releaseWakeLock() {
    try {
      if (wakeLock) {
        wakeLock.release();
        wakeLock = null;
      }
    } catch (e) {
      // ignore
    }
  }

  function startPacing() {
    pacingRunning = true;
    pacingToggleBtn.textContent = 'Stop Auto';
    pacingToggleBtn.classList.add('running');
    if (count < target) {
      applyOneTick();
      render();
      saveState();
    }
    scheduleNextTick();
    pacingTimerId = setInterval(checkTick, 1000);
    requestWakeLock();
  }

  function stopPacing() {
    pacingRunning = false;
    pacingToggleBtn.textContent = 'Start Auto';
    pacingToggleBtn.classList.remove('running');
    if (pacingTimerId) {
      clearInterval(pacingTimerId);
      pacingTimerId = null;
    }
    releaseWakeLock();
  }

  pacingToggleBtn.addEventListener('click', function() {
    unlockAudioContext();
    if (pacingRunning) {
      stopPacing();
    } else {
      startPacing();
    }
  });

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(function() {});
      }
      if (pacingRunning) {
        checkTick();
        if (pacingRunning && !wakeLock) {
          requestWakeLock();
        }
      }
    }
  });

  loadState();
  render();
})();
</script>


<script>
  // Register a service worker (inline via Blob) so the app can be installed and cached for offline use.
  if ('serviceWorker' in navigator) {
    const swSource = `
      const CACHE_NAME = 'astaghfirullah-counter-v1';
      self.addEventListener('install', function(event) {
        self.skipWaiting();
      });
      self.addEventListener('activate', function(event) {
        self.clients.claim();
      });
      self.addEventListener('fetch', function(event) {
        event.respondWith(
          caches.open(CACHE_NAME).then(function(cache) {
            return fetch(event.request).then(function(response) {
              if (event.request.method === 'GET' && response && response.status === 200) {
                cache.put(event.request, response.clone());
              }
              return response;
            }).catch(function() {
              return cache.match(event.request);
            });
          })
        );
      });
    `;
    try {
      const blob = new Blob([swSource], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      window.addEventListener('load', function() {
        navigator.serviceWorker.register(swUrl).catch(function() {
          // Some browsers block blob: service worker registration; app still works normally without it.
        });
      });
    } catch (e) {
      // service worker setup unavailable, app still functions fully without offline caching
    }
  }

  // Optional: surface an "Install App" affordance when the browser supports it.
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredInstallPrompt = e;
    const btn = document.getElementById('installBtn');
    if (btn) btn.style.display = 'block';
  });
  window.addEventListener('DOMContentLoaded', function() {
    const btn = document.getElementById('installBtn');
    if (btn) {
      btn.addEventListener('click', function() {
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          deferredInstallPrompt = null;
          btn.style.display = 'none';
        }
      });
    }
  });
</script>
